<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campaigns | XR App</title>
  <link rel="icon" href="/Just%20A%20purp.ico">
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body class="wr-scope">
  <div id="nav"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared/auth.js"></script>
  <script src="/shared/nav.js"></script>

  <main class="wrap">
    <header>
      <div style="display:flex; align-items:center; gap:0.5rem; justify-content:space-between; flex-wrap:wrap;">
        <a class="action-btn" href="/dashboard.html" aria-label="Back to profile">
          <span aria-hidden="true">←</span>
          <span>Back to Profile</span>
        </a>
      </div>
      <h1>Campaign Management</h1>
    </header>

    <div style="display:grid; gap:1rem; grid-template-columns:1fr;" class="wr-mt-1">
      <section class="card">
        <h2>Create Campaign</h2>
        <label>Campaign name
          <input id="newCampaignName" type="text" maxlength="80" placeholder="Weekend Run" />
        </label>
        <label>System
          <select id="newCampaignSystem">
            <option value="xrrpg">XRRPG</option>
            <option value="webrunning">Webrunning</option>
          </select>
        </label>
        <button id="createCampaignBtn" type="button">Create Campaign</button>
        <div id="createStatus" class="mono muted wr-mt-0-5"></div>
      </section>

      <section class="card">
        <h2>Your Campaigns</h2>
        <div id="campaignList">Loading campaigns…</div>
      </section>
    </div>
  </main>

  <div id="renameModal" class="xr-modal hidden">
    <div class="xr-modal-backdrop"></div>
    <div class="xr-modal-card">
      <h2>Rename Campaign</h2>
      <label>New name <input id="renameInput" type="text" maxlength="80" /></label>
      <div class="xr-modal-actions">
        <button id="cancelRenameBtn" type="button">Cancel</button>
        <button id="confirmRenameBtn" type="button">Save</button>
      </div>
      <div id="renameStatus" class="mono muted" style="margin-top:0.5rem;"></div>
    </div>
  </div>

  <div id="deleteCampaignModal" class="xr-modal hidden">
    <div class="xr-modal-backdrop"></div>
    <div class="xr-modal-card">
      <h2>Delete Campaign</h2>
      <p id="deleteCampaignMsg"></p>
      <div class="xr-modal-actions">
        <button id="cancelDeleteCampaignBtn" type="button">Cancel</button>
        <button id="confirmDeleteCampaignBtn" type="button" style="background:var(--color-danger,#c0392b);color:#fff;border:none;padding:0.4rem 1rem;border-radius:4px;cursor:pointer;">Delete</button>
      </div>
      <div id="deleteStatus" class="mono muted" style="margin-top:0.5rem;"></div>
    </div>
  </div>

  <script>
    const sb = window.supabaseClient;

    let currentUser = null;
    let memberships = [];

    async function requireUser() {
      const { data: { user } } = await sb.auth.getUser();
      if (!user) {
        window.location.href = "/login.html";
        throw new Error("No user");
      }
      return user;
    }

    async function loadCampaigns() {
      currentUser = await requireUser();
      const { data, error } = await sb
        .from("campaign_members")
        .select("campaign_id, role, campaigns(id, name, gm_user_id, system)")
        .eq("user_id", currentUser.id)
        .order("joined_at", { ascending: true });

      const list = document.getElementById("campaignList");
      if (error) {
        list.textContent = `Failed to load campaigns: ${error.message}`;
        return;
      }

      memberships = data || [];
      if (!memberships.length) {
        list.innerHTML = '<p class="muted">No campaigns yet. Create one above or accept an invite from Notifications.</p>';
        return;
      }

      list.innerHTML = `<table class="table-full"><thead><tr><th>Name</th><th>System</th><th>Role</th><th></th></tr></thead><tbody>${memberships.map(m => {
        const role = m.role === 'gm' ? 'GM' : 'Player';
        const system = (m.campaigns?.system || 'xrrpg').toLowerCase();
        const viewHref = system === 'webrunning' ? `/webrunning-2.0/webrunning-campaign.html?id=${m.campaign_id}` : `/xrrpg-2.0/xrrpg-campaign.html?id=${m.campaign_id}`;
        const gmBtns = m.role === 'gm' ? `
          <button class="action-btn" type="button" onclick="openRename('${m.campaign_id}')">Rename</button>
          <button class="action-btn" type="button" style="color:var(--color-danger,#c0392b)" onclick="openDelete('${m.campaign_id}')">Delete</button>` : '';
        return `<tr><td><strong>${m.campaigns?.name || 'Unnamed Campaign'}</strong></td><td>${system}</td><td>${role}</td><td style="display:flex;gap:0.4rem;flex-wrap:wrap;"><a class="action-btn" href="${viewHref}">View</a>${gmBtns}</td></tr>`;
      }).join('')}</tbody></table>`;
    }

    document.getElementById("createCampaignBtn").onclick = async () => {
      const name = document.getElementById("newCampaignName").value.trim();
      const status = document.getElementById("createStatus");
      status.textContent = '';
      if (!name) { status.textContent = "Enter a campaign name first."; return; }

      const system = document.getElementById('newCampaignSystem').value;
      const { data: insertedCampaign, error: campaignError } = await sb.from("campaigns")
        .insert({ name, gm_user_id: currentUser.id, status: "active", system })
        .select("id, name")
        .single();

      if (campaignError || !insertedCampaign) {
        status.textContent = `Failed to create campaign: ${campaignError?.message || "Unknown error"}`;
        return;
      }

      const { error: gmMembershipError } = await sb.from("campaign_members").insert({
        campaign_id: insertedCampaign.id,
        user_id: currentUser.id,
        role: "gm"
      });
      if (gmMembershipError) {
        status.textContent = `Campaign created, but failed to register you as GM: ${gmMembershipError.message}`;
        return;
      }

      document.getElementById("newCampaignName").value = "";
      status.textContent = `Campaign "${insertedCampaign.name}" created.`;
      await loadCampaigns();
    };

    let pendingRenameId = null;
    let pendingDeleteId = null;

    function openRename(id) {
      const m = memberships.find(x => x.campaign_id === id);
      pendingRenameId = id;
      document.getElementById("renameInput").value = m?.campaigns?.name || '';
      document.getElementById("renameStatus").textContent = '';
      document.getElementById("renameModal").classList.remove("hidden");
    }

    function openDelete(id) {
      const m = memberships.find(x => x.campaign_id === id);
      pendingDeleteId = id;
      document.getElementById("deleteCampaignMsg").textContent = `Delete "${m?.campaigns?.name || 'this campaign'}"? This cannot be undone.`;
      document.getElementById("deleteStatus").textContent = '';
      document.getElementById("deleteCampaignModal").classList.remove("hidden");
    }

    document.getElementById("cancelRenameBtn").onclick = () => {
      document.getElementById("renameModal").classList.add("hidden");
      pendingRenameId = null;
    };
    document.getElementById("renameModal").querySelector(".xr-modal-backdrop").onclick = () => {
      document.getElementById("renameModal").classList.add("hidden");
      pendingRenameId = null;
    };
    document.getElementById("confirmRenameBtn").onclick = async () => {
      const newName = document.getElementById("renameInput").value.trim();
      const status = document.getElementById("renameStatus");
      if (!newName) { status.textContent = "Enter a name."; return; }
      const { error } = await sb.from("campaigns").update({ name: newName })
        .eq("id", pendingRenameId)
        .eq("gm_user_id", currentUser.id);
      if (error) { status.textContent = `Failed: ${error.message}`; return; }
      document.getElementById("renameModal").classList.add("hidden");
      pendingRenameId = null;
      await loadCampaigns();
    };

    document.getElementById("cancelDeleteCampaignBtn").onclick = () => {
      document.getElementById("deleteCampaignModal").classList.add("hidden");
      pendingDeleteId = null;
    };
    document.getElementById("deleteCampaignModal").querySelector(".xr-modal-backdrop").onclick = () => {
      document.getElementById("deleteCampaignModal").classList.add("hidden");
      pendingDeleteId = null;
    };
    document.getElementById("confirmDeleteCampaignBtn").onclick = async () => {
      const status = document.getElementById("deleteStatus");
      status.textContent = "Deleting…";
      await sb.from("campaign_character_assignments").delete().eq("campaign_id", pendingDeleteId);
      await sb.from("campaign_members").delete().eq("campaign_id", pendingDeleteId);
      const { error } = await sb.from("campaigns").delete()
        .eq("id", pendingDeleteId)
        .eq("gm_user_id", currentUser.id);
      if (error) { status.textContent = `Failed: ${error.message}`; return; }
      document.getElementById("deleteCampaignModal").classList.add("hidden");
      pendingDeleteId = null;
      await loadCampaigns();
    };

    loadCampaigns();
  </script>
</body>
</html>
